<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目作品 · ITX.dev</title>
  <meta name="description" content="大豆包.dev 的项目作品集 —— 个人主页 / 天气小程序 / 开源组件库" />

  <!-- 本地 Tailwind 样式（和主页共用同一份 styles.css）
       新增从未用过的 Tailwind class 后需重建：双击 build-css.bat -->
  <link rel="stylesheet" href="styles.css">

  <!-- 【保持在 head】主题预加载：必须在页面渲染前执行，防止深色模式"白闪"，勿移动 -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const dark = saved ? saved === 'dark'
                         : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>

  <style>
    /* 锚点跳转时给固定顶栏留位置 */
    html { scroll-padding-top: 5rem; }

    /* 滚动进入动画：初始透明，加 .visible 后浮现 */
    .reveal { opacity: 0; transform: translateY(24px); transition: all .7s cubic-bezier(.22,.61,.36,1); }
    .reveal.visible { opacity: 1; transform: none; }

    /* 进入本页时的整体淡入 */
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .page-fade { animation: fade-in .35s ease-out; }

    /* ===== 顶栏两种状态 =====
       over-hero  = 浮在彩色首屏上（透明底 + 白字）
       去掉之后   = 白底深字 + 毛玻璃 + 分隔线
       （这里必须用 .site-header 类选择器、不能用 id，否则会盖掉 hover 效果） */
    .site-header { background: transparent; border-bottom: 1px solid transparent; transition: background .3s, border-color .3s; }
    .site-header .h-brand,
    .site-header .h-back,
    .site-header .h-icon { color: #fff; }
    .site-header .h-brand span { color: rgba(255,255,255,.65); }
    .site-header .h-back { border-color: rgba(255,255,255,.45); }
    .site-header .h-back:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,.14); }

    .site-header:not(.over-hero) {
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(10px);
      border-bottom-color: rgb(226 232 240);
    }
    .dark .site-header:not(.over-hero) {
      background: rgba(2,6,23,.85);
      border-bottom-color: rgb(30 41 59);
    }
    .site-header:not(.over-hero) .h-brand,
    .site-header:not(.over-hero) .h-back,
    .site-header:not(.over-hero) .h-icon { color: rgb(51 65 85); }
    .dark .site-header:not(.over-hero) .h-brand,
    .dark .site-header:not(.over-hero) .h-back,
    .dark .site-header:not(.over-hero) .h-icon { color: rgb(226 232 240); }
    .site-header:not(.over-hero) .h-brand span { color: rgb(99 102 241); }
    .site-header:not(.over-hero) .h-back { border-color: rgb(203 213 225); }
    .dark .site-header:not(.over-hero) .h-back { border-color: rgb(51 65 85); }
    .site-header:not(.over-hero) .h-back:hover { color: rgb(99 102 241); border-color: rgb(99 102 241); background: transparent; }

    /* 首屏文字逐个浮出 */
    .hero-in { animation: fade-in .6s cubic-bezier(.22,.61,.36,1) both; }

    /* ===== 首屏背景：工程蓝图风格（呼应「项目作品 = 施工图纸」） =====
       六层全部用 CSS 渐变画出来，不加载任何图片、不影响加载速度：
         ① .hero-blueprint  深蓝底（首屏固定深色，不随主题切换）
         ② .hero-grid       细网格 32px + 每 5 格一条粗线 160px
         ③ .hero-scan       缓慢下移的扫描光带（纯装饰）
         ④ .hero-glow       三团径向光晕：青 / 靛 / 品红
         ⑤ .hero-corner     四角图纸定位角标（L 形）
         ⑥ .hero-mark       右侧超大的半透明 </> 水印
         ⑦ .hero-fade       底部渐隐到页面底色，和下方浅灰区自然衔接
       【想换配色】只改 ①的底色 和 ④的三处 rgba 即可，其余不用动 */

    .hero-blueprint { background-color: #0a1020; }

    .hero-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(56,189,248,.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,.075) 1px, transparent 1px),
        linear-gradient(rgba(56,189,248,.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,.16) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      /* 四周淡出，避免网格像贴纸一样有硬边 */
      -webkit-mask-image: radial-gradient(125% 105% at 50% 32%, #000 32%, transparent 88%);
              mask-image: radial-gradient(125% 105% at 50% 32%, #000 32%, transparent 88%);
    }

    @keyframes hero-scan {
      from { transform: translateY(-40%); }
      to   { transform: translateY(340%); }
    }
    .hero-scan {
      position: absolute; inset-inline: 0; top: 0; height: 32%; pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(103,232,249,.10), transparent);
      animation: hero-scan 8s ease-in-out infinite;
    }

    .hero-glow {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(55% 60% at 12% 8%,  rgba(34,211,238,.28), transparent 70%),
        radial-gradient(50% 55% at 88% 88%, rgba(99,102,241,.34), transparent 72%),
        radial-gradient(38% 40% at 72% 18%, rgba(217,70,239,.16), transparent 70%);
    }

    /* 四角角标：只画 L 形的两条边，另外两边保持透明 */
    .hero-corner { position: absolute; width: 26px; height: 26px; pointer-events: none; border-color: rgba(103,232,249,.45); }
    .hero-corner.tl { top: 22px;    left: 22px;  border-top: 1px solid; border-left: 1px solid; }
    .hero-corner.tr { top: 22px;    right: 22px; border-top: 1px solid; border-right: 1px solid; }
    .hero-corner.bl { bottom: 22px; left: 22px;  border-bottom: 1px solid; border-left: 1px solid; }
    .hero-corner.br { bottom: 22px; right: 22px; border-bottom: 1px solid; border-right: 1px solid; }

    .hero-mark {
      position: absolute; right: -1%; top: 50%; transform: translateY(-50%);
      pointer-events: none; user-select: none; line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(8rem, 24vw, 18rem); font-weight: 800; letter-spacing: -.05em;
      color: rgba(125,211,252,.07);
    }

    .hero-fade {
      position: absolute; inset-inline: 0; bottom: 0; height: 6rem; pointer-events: none;
      background: linear-gradient(to bottom, rgba(248,250,252,0), rgb(248 250 252));
    }
    .dark .hero-fade { background: linear-gradient(to bottom, rgba(2,6,23,0), rgb(2 6 23)); }

    /* 「项目介绍」可展开区：靠 grid-template-rows 0fr→1fr 实现高度过渡
       （和主页游戏卡展开是同一套写法，全站保持一致）
       注意：内层必须再包一个 overflow:hidden 的 div，否则收起时内容会漏出来 */
    .pj-detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .35s ease;
    }
    .pj-card.open .pj-detail { grid-template-rows: 1fr; }
    .pj-detail > div { overflow: hidden; }

    /* 圆形按钮里的「＋」：展开时旋转 45° 变成「×」（主页游戏卡是箭头转 180°，这里刻意换一种） */
    .pj-card.open .pj-plus { transform: rotate(45deg); }

    /* 展开后五块内容逐条浮出，制造节奏感（延迟按 nth-child 递增） */
    @keyframes intro-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .pj-card.open .intro-item { animation: intro-in .45s cubic-bezier(.22,.61,.36,1) both; }
    .pj-card.open .intro-item:nth-child(2) { animation-delay: .06s; }
    .pj-card.open .intro-item:nth-child(3) { animation-delay: .12s; }
    .pj-card.open .intro-item:nth-child(4) { animation-delay: .18s; }
    .pj-card.open .intro-item:nth-child(5) { animation-delay: .24s; }

    /* 时间轴最后一块不再往下画线，否则末尾会拖一条多余的尾巴 */
    .intro-item:last-child .tl-line { display: none; }

    /* ===== 文字区块：渐变毛玻璃 =====
       盖在铺满整卡的封面图上，backdrop-filter 负责模糊背后的画面，
       上面再叠一层从左上到右下的白色渐变，保证文字始终读得清。
       ⚠️ backdrop-filter 需要父级有 isolation:isolate（见 L551 的 .isolate），
          否则模糊会穿透到整页背景，效果不对。 */
    .pj-glass {
      background-image: linear-gradient(
        135deg,
        rgba(255,255,255,.86) 0%,
        rgba(255,255,255,.70) 48%,
        rgba(255,255,255,.54) 100%
      );
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border-left: 1px solid rgba(255,255,255,.65);
    }
    .dark .pj-glass {
      background-image: linear-gradient(
        135deg,
        rgba(2,6,23,.86) 0%,
        rgba(2,6,23,.70) 48%,
        rgba(2,6,23,.54) 100%
      );
      border-left-color: rgba(255,255,255,.12);
    }
    /* 没填封面图时背后只是纯色，模糊没有意义，直接还原成朴素分隔线 */
    .pj-card:not(.has-cover) .pj-glass {
      background-image: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-left: 1px solid rgb(226 232 240);
    }
    .dark .pj-card:not(.has-cover) .pj-glass { border-left-color: rgb(30 41 59); }

    /* 「项目介绍」展开按钮那一行：整条宽度的毛玻璃 */
    .pj-glass-bar {
      background-image: linear-gradient(to right, rgba(255,255,255,.82), rgba(255,255,255,.60));
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    .dark .pj-glass-bar {
      background-image: linear-gradient(to right, rgba(2,6,23,.82), rgba(2,6,23,.60));
    }
    .pj-glass-bar:hover {
      background-image: linear-gradient(to right, rgba(255,255,255,.94), rgba(255,255,255,.76));
    }
    .dark .pj-glass-bar:hover {
      background-image: linear-gradient(to right, rgba(2,6,23,.94), rgba(2,6,23,.76));
    }

    /* 「项目介绍」内层面板：圆角玻璃，底下透出一点强调色 */
    .pj-glass-soft {
      background-image: linear-gradient(135deg, rgba(255,255,255,.82), rgba(255,255,255,.60));
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
    }
    .dark .pj-glass-soft {
      background-image: linear-gradient(135deg, rgba(2,6,23,.82), rgba(2,6,23,.60));
    }

    /* 同上：无封面图的卡片退回朴素样式，避免模糊穿透到整页背景 */
    .pj-card:not(.has-cover) .pj-glass-bar,
    .pj-card:not(.has-cover) .pj-glass-soft {
      background-image: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    /* 【无障碍】系统开启「减少动态效果」时关掉全部动画 */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .page-fade, .hero-in { animation: none; }
      .hero-scan { animation: none; opacity: .5; }   /* 扫描光带停住，保留一点质感 */
      .pj-detail, .pj-plus { transition: none; }
      .pj-card.open .intro-item { animation: none; }
    }
  </style>

  <!-- 【兜底】禁用 JS 时 .reveal 初始是 opacity:0，没有 JS 就永远看不见内容 -->
  <noscript>
    <style>
      .reveal { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">

  <!-- 【无障碍】跳到主内容：平时隐藏，键盘 Tab 第一下聚焦时滑出 -->
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-[70] focus:rounded-full focus:bg-indigo-600 focus:px-4 focus:py-2 focus:text-sm focus:text-white">
    跳到主内容
  </a>

  <!-- ===================== 顶栏（浮在首屏上，往下滚才变白底） ===================== -->
  <header id="siteHeader" class="site-header over-hero fixed top-0 inset-x-0 z-50 h-16">
    <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 h-16">

      <div class="flex items-center gap-3">

           class="h-back inline-flex items-center gap-1.5 rounded-full border px-4 py-1.5 text-sm font-medium transition-colors">
          <span aria-hidden="true">←</span> 返回主页
        </a>

        <button id="themeBtn" aria-label="切换深色模式" class="h-icon p-2 rounded-full hover:bg-white/20 transition-colors">
          <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.3-11.3 1.4-1.4"/></svg>
          <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>

  <main id="main" class="page-fade">

    <!-- ===================== 首屏：工程蓝图风格（网格 / 角标 / 扫描光带） =====================
         全部是 CSS 画的，没有图片。改配色看 <style> 里 .hero-blueprint 与 .hero-glow 的注释 -->
    <section id="hero" class="hero-blueprint relative overflow-hidden text-white">
      <!-- 装饰层（纯装饰，aria-hidden 让读屏软件忽略） -->
      <div aria-hidden="true" class="hero-grid"></div>
      <div aria-hidden="true" class="hero-scan"></div>
      <div aria-hidden="true" class="hero-glow"></div>
      <div aria-hidden="true" class="hero-corner tl"></div>
      <div aria-hidden="true" class="hero-corner tr"></div>
      <div aria-hidden="true" class="hero-corner bl"></div>
      <div aria-hidden="true" class="hero-corner br"></div>
      <div aria-hidden="true" class="hero-mark">&lt;/&gt;</div>
      <div aria-hidden="true" class="hero-fade"></div>

      <div class="relative max-w-5xl mx-auto px-6 pt-28 pb-16 md:pt-32 md:pb-20">
        <!-- 蓝图上的"图纸标注"：等宽字体 + 前置斜杠，像代码注释 -->
        <p class="hero-in font-mono text-xs md:text-sm font-semibold tracking-[0.22em] uppercase text-cyan-300/80" style="animation-delay:.05s">// Selected Works</p>
        <h1 class="hero-in mt-4 text-4xl md:text-6xl font-extrabold tracking-tight" style="animation-delay:.15s">项目作品</h1>
        <p class="hero-in mt-5 max-w-2xl text-base md:text-lg text-slate-300 leading-relaxed" style="animation-delay:.25s">
          这里是我做过的东西。有些是想自己做点实用的东西，有些纯粹是闲的没事做着玩。点开任意一张卡片，可以看它的设计稿与实拍截图。
        </p>

        <!-- 统计：数字由 JS 按项目数据自动算出来 -->
        <dl class="hero-in mt-10 grid grid-cols-3 gap-6 max-w-lg" style="animation-delay:.35s">
          <div class="border-l-2 border-cyan-400/40 pl-3">
            <dd class="font-mono text-3xl md:text-4xl font-extrabold text-cyan-200" id="statProjects">0</dd>
            <dt class="mt-1 text-xs md:text-sm text-slate-400">个项目</dt>

            <dt class="mt-1 text-xs md:text-sm text-slate-400">个分类</dt>
          </div>
        </dl>
      </div>
    </section>

    <!-- ===================== 面包屑 + 分类筛选（吸顶） ===================== -->
    <div class="sticky top-16 z-30 border-b border-slate-200 dark:border-slate-800 bg-slate-50/85 dark:bg-slate-950/85 backdrop-blur">
      <div class="max-w-5xl mx-auto px-6 py-3 flex flex-col md:flex-row md:items-center gap-3">
        <nav aria-label="面包屑导航" class="flex items-center gap-2 text-sm text-slate-500 shrink-0">
          <a href="index.html" class="hover:text-indigo-500 transition-colors">主页</a>

        <!-- 筛选按钮由 JS 生成，点哪个就只显示那个分类 -->

    <!-- ===================== 项目卡片列表（由 JS 渲染） ===================== -->

      <div class="max-w-5xl mx-auto px-6">

    <!-- 底部返回 -->

  <!-- ===================== 图片灯箱（点缩略图后全屏看图） ===================== -->
  <div id="lightbox" class="fixed inset-0 z-[60] hidden flex flex-col items-center justify-center bg-black/85 p-4"
       role="dialog" aria-modal="true" aria-label="图片查看器">
    <button id="lbClose" aria-label="关闭" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 text-white text-xl hover:bg-white/25 transition-colors">✕</button>

    <p id="lbCap" class="mt-4 text-sm text-white/80"></p>
  </div>

  <script>
    /* ---------- 1. 深色模式（和主页逻辑一致） ---------- */
    const themeBtn = document.getElementById('themeBtn');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    const applyTheme = (dark) => {
      document.documentElement.classList.toggle('dark', dark);
      iconSun.classList.toggle('hidden', !dark);   // 深色时显示太阳
      iconMoon.classList.toggle('hidden', dark);   // 浅色时显示月亮
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    };
    // head 里的脚本已提前设好 dark 类（防白闪），这里以当前状态为准同步图标
    applyTheme(document.documentElement.classList.contains('dark'));
    themeBtn.addEventListener('click', () =>
      applyTheme(!document.documentElement.classList.contains('dark')));


    /* ---------- 2. 项目数据（★ 只改这里就能换内容） ----------
     *
     * 怎么加照片：
     *   1) 把图片放进  images/projects/  文件夹（文件名用英文小写，如 notes-cover.jpg）
     *   2) cover  : 封面大图，填 'images/projects/notes-cover.jpg'
     *      photos : 截图数组，可以放任意张，每张带一句 caption 说明
     *   3) 没填或文件不存在 → 自动显示 icon 占位块，不会出破图
     *
     * 字段说明：

      const body = text
        ? `<p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${text}</p>`

      const bgLayer = hasCover ? `

        </div>`;

      const strip = p.photos.length ? `
        <div class="mt-6">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">实拍截图 · 点击放大</p>
          <div class="flex flex-wrap gap-2">
            ${p.photos.map((ph, i) => `
              <button data-album="${idx}" data-index="${i}"

    // 图片坏掉/不存在时：把 img 藏起来，露出底下的占位块（避免出现破图图标）
    function bindImageFallback(scope) {
      scope.querySelectorAll('img[data-fallback]').forEach(img => {
        const ph = img.parentElement.querySelector('[data-placeholder]');
        const fail = () => { img.classList.add('hidden'); if (ph) ph.classList.remove('hidden'); };
        const ok = () => { if (img.naturalWidth > 0 && ph) ph.classList.add('hidden'); };
        img.addEventListener('error', fail);
        img.addEventListener('load', ok);
        // 图片被缓存时 load 可能早于本脚本执行，这里补判一次
        if (img.complete) img.naturalWidth > 0 ? ok() : fail();
      });
    }

    }

    listEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-album]');
      if (!btn) return;
      const p = projects[Number(btn.dataset.album)];
      if (p && p.photos.length) openLightbox(p.photos, Number(btn.dataset.index));
    });

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => showPhoto(lbIdx - 1));
    document.getElementById('lbNext').addEventListener('click', () => showPhoto(lbIdx + 1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });   // 点黑色背景也能关
    addEventListener('keydown', e => {
      if (lb.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPhoto(lbIdx - 1);
      if (e.key === 'ArrowRight') showPhoto(lbIdx + 1);
    });


    /* ---------- 6. 项目介绍 展开 / 收起 ---------- */
    // 事件委托挂在 listEl 上（而不是每个按钮上），这样筛选重渲染后不用重新绑定
    listEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-intro]');
      if (!btn) return;
      const card = btn.closest('.pj-card');
      const open = card.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('.pj-label').textContent = open
        ? '点击收起'
        : '点击展开：背景 · 目标 · 过程 · 难点 · 收获';
    });

    /* ---------- 7. 滚动浮现动画 ---------- */
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('visible');
        io.unobserve(e.target);
      });
    }, { threshold: 0.12 });

    function observeReveal() {
      document.querySelectorAll('#projectList .reveal').forEach(el => {
        if (!el.classList.contains('visible')) io.observe(el);
      });
    }
    // 老浏览器没有 IntersectionObserver 时直接全部显示，避免内容永远透明
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    }


    /* ---------- 8. 顶栏：滚过首屏后从「透明白字」变「白底深字」 ---------- */
    const header = document.getElementById('siteHeader');
    const hero = document.getElementById('hero');
    function syncHeader() {
      header.classList.toggle('over-hero', window.scrollY < hero.offsetHeight - 64);
    }
    addEventListener('scroll', syncHeader, { passive: true });
    syncHeader();


    /* ---------- 9. 首屏统计数字 + 首次渲染 ---------- */
    document.getElementById('statProjects').textContent = projects.length;
    document.getElementById('statPhotos').textContent =
      projects.reduce((n, p) => n + p.photos.length, 0);
    document.getElementById('statCats').textContent = cats.length - 1;

    renderList();
  </script>
</body>
</html>
