<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏库 · ITX.dev</title>
  <meta name="description" content="ITX 的游戏库 —— 生化危机 / 街霸6 / Metro / Minecraft，3D 转盘 + 光盘盒开盒 + 游戏截图浏览。" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ==========================================================
       街机霓虹主题（与项目页的蓝图 + 毛玻璃风格刻意区分）
       固定深色：霓虹只有在暗底上才出效果，本页不提供浅色切换
       ========================================================== */
    html { scroll-behavior: smooth; }
    body {
      background: #07060f;
      color: #e9e8f7;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 背景三层：星云 / 网格 / 地平线 ---------- */
    .arcade-bg {
      position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background: radial-gradient(120% 80% at 50% 0%, #1a1140 0%, #0a0718 45%, #050409 100%);
    }
    .arcade-grid {
      position: absolute; inset: -10%;
      background-image:
        linear-gradient(rgba(34,211,238,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,.09) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(120% 90% at 50% 28%, #000 25%, transparent 72%);
              mask-image: radial-gradient(120% 90% at 50% 28%, #000 25%, transparent 72%);
    }
    .arcade-horizon {
      position: absolute; left: -25%; right: -25%; bottom: -2%; height: 42%;
      background-image:
        linear-gradient(rgba(245,216,10,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,45,85,.13) 1px, transparent 1px);
      background-size: 72px 40px;
      transform: perspective(320px) rotateX(62deg);
      transform-origin: bottom center;
      animation: horizon-run 6s linear infinite;
      opacity: .55;
    }
    @keyframes horizon-run { from { background-position: 0 0; } to { background-position: 0 40px; } }

    /* ---------- 斜向慢速漂移的游戏元素（手柄 / 摇杆 / 十字键 / 幽灵…） ----------
       挂在 .arcade-bg 内部，跟随背景层一起沉在内容之下；pointer-events:none 不挡交互。
       每个图标的可调变量：
         --l 起始 left   --d 全程时长（越大越慢）   --delay 负延迟（初始散布位置）
         --s 尺寸        --r 固定倾斜角              --o 不透明度   --c 霓虹色 */
    .arcade-drift { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .arcade-drift svg {
      position: absolute; top: 108%; left: var(--l, 0%);
      width: var(--s, 64px); height: var(--s, 64px);
      color: var(--c, #22d3ee);
      opacity: var(--o, .14);
      filter: drop-shadow(0 0 10px currentColor);
      will-change: transform;
      animation: drift-up var(--d, 70s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    /* 从左下屏幕外 → 右上屏幕外（斜向约 15°）；起止都在屏外，循环无跳变 */
    @keyframes drift-up {
      from { transform: translate3d(0, 0, 0) rotate(var(--r, 0deg)); }
      to   { transform: translate3d(55vw, -225vh, 0) rotate(var(--r, 0deg)); }
    }
    @media (max-width: 640px) {
      .arcade-drift svg { width: calc(var(--s, 64px) * .72); height: calc(var(--s, 64px) * .72); }
      .arcade-drift svg:nth-of-type(n+5) { display: none; }
    }

    /* ---------- CRT 扫描线（覆盖全屏，不挡点击） ---------- */
    .scanlines {
      position: fixed; inset: 0; z-index: 60; pointer-events: none;
      background: repeating-linear-gradient(to bottom,
        rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    }
    .scanlines::after {
      content: ""; position: absolute; left: 0; right: 0; height: 22vh;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.045), transparent);
      animation: crt-sweep 7s linear infinite;
    }
    @keyframes crt-sweep { from { transform: translateY(-25vh); } to { transform: translateY(105vh); } }

    /* ---------- 霓虹文字 ---------- */
    .neon {
      color: #fff;
      text-shadow: 0 0 8px var(--nc, #22d3ee), 0 0 26px rgba(34,211,238,.75), 0 0 60px rgba(168,85,247,.6);
    }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; }

    /* ---------- 吸顶导航 ---------- */
    #topbar {
      position: sticky; top: 0; z-index: 55;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: rgba(7,6,15,.72);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    /* ---------- 3D 转盘舞台 ---------- */
    .stage {
      position: relative;
      height: 500px;
      perspective: 1600px;
      perspective-origin: 50% 45%;
      touch-action: pan-y;
      transition: height .55s cubic-bezier(.22,.61,.36,1);
    }
    .stage.open { height: 680px; }
    #ring {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0;
      transform-style: preserve-3d;
    }

    /* ==========================================================
       游戏光盘盒
       --pageW : 单页宽度（封面宽 = 光盘页宽 = 内页宽）
       --caseW : 整个盒子的占位宽，关盒 = 1 页，开盒 = 2 页
       封面铰链在左缘，开盒时 rotateY(-180deg) 翻到左半
       ========================================================== */
    .gc {
      --pageW: 272px;
      --cardH: 366px;
      --caseW: var(--pageW);
      --r: 24px;                 /* 盒角半径：统一由它控制，改一个数全盒生效 */
      /* 开盒时盒壳的内衬边 / 中缝宽。关盒时都为 0（两页完全重叠，就是整块盒子） */
      --edge: 0px;               /* 盒壳四周露出的沿宽 */
      --spine: 0px;              /* 两页之间留给盒脊的距离 */
      /* 盒壳与两页共用同一块底色（纯竖直渐变）：两页、盒脊、盒沿是同一个材质，
         开盒后看起来才是一只盒子，而不是几块拼起来的板 */
      --case-bg: linear-gradient(to bottom, #1b1536 0%, #100c22 52%, #0a0716 100%);
      position: absolute; left: 0; top: 0;
      width: var(--caseW); height: var(--cardH);
      cursor: pointer;
      /* ⚠️ 这里不能写 overflow:hidden —— 会把 transform-style 压成 flat，开盒的 3D 就废了 */
      transform-style: preserve-3d;
      /* 圆角过渡：开盒时盒宽翻倍，半径不变容易显突兀，交给 transform 承担即可 */
      transition:
        transform .7s cubic-bezier(.22,.61,.36,1),
        width .6s cubic-bezier(.22,.61,.36,1),
        height .6s cubic-bezier(.22,.61,.36,1),
        opacity .45s ease;
      will-change: transform;
    }
    .gc:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .gc.is-back { pointer-events: none; }
    .gc.open {
      /* 42vw 上限：中等屏（768~1100px）盒子不会顶到屏幕边缘 */
      --pageW: min(460px, 42vw);
      --cardH: min(600px, 84vh);
      /* 盒子总宽 = 两页 + 中缝 + 左右两侧的盒沿 */
      --edge: 12px;
      --spine: 34px;
      --caseW: calc(var(--pageW) * 2 + var(--spine) + var(--edge) * 2);
      cursor: default;
      z-index: 999 !important;
    }

    /* ---------- 盒壳（开盒后露出的盒子本体） ----------
       两页是「镶在盒壳里的两块托盘」，各自与盒壳外缘留出 --edge 的沿、
       与中缝留出 --spine 的距离。所有内容都在两页内部，盒沿与盒脊只压在
       盒壳上，从结构上就不可能挡住内容。 */
    .case-floor {
      position: absolute; inset: 0;
      border-radius: var(--r);
      background:
        /* 中缝两侧的凹陷：只在盒壳上，压不到两页 */
        linear-gradient(90deg,
          transparent calc(50% - 92px),
          rgba(0,0,0,.22) calc(50% - 40px),
          rgba(0,0,0,.55) 50%,
          rgba(0,0,0,.22) calc(50% + 40px),
          transparent calc(50% + 92px)),
        var(--case-bg);
      /* 盒沿三层：外缘亮线 → 8px 塑料沿面 → 12px 处收回内衬（留 4px 暗缝当凹槽）。
         全部贴在盒壳最外圈，两页从 12px 处才开始，结构上压不到内容。
         ⚠️ 这里不能加「大范围外阴影」：preserve-3d 里带大模糊外阴影的图层会
         被拆成多块重绘，右页内容会横向错位/重影（无头截图可稳定复现）。 */
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.24),
        inset 0 0 0 9px rgba(255,255,255,.07),
        inset 0 0 22px 12px rgba(0,0,0,.55);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity .45s ease;
    }
    .gc.open .case-floor { opacity: 1; }

    /* ---------- 盒底 = 右页（内页图 + 文字介绍） ---------- */
    .case-base {
      position: absolute;
      top: var(--edge); right: var(--edge);
      height: calc(100% - var(--edge) * 2);
      width: var(--pageW);
      /* 现在是「镶在盒壳里的托盘」：四角都圆，四周与盒沿留出距离 */
      border-radius: var(--r);
      clip-path: inset(0 round var(--r));
      overflow: hidden;
      background: var(--case-bg);
      border: 1px solid rgba(255,255,255,.12);
      opacity: 1;
    }
    /* 🔴 关盒时这一页就是「整个盒底」，四角必须都是圆角。
       它和封面同尺寸叠在下面；封面是圆角，圆弧外侧那一小块没有遮挡 →
       露出它的直角 + 内页横幅的颜色，看起来就像「盒子角上多出一块方形色块」。
       只在动画结束后隐藏不够：关盒动画的前 0.85s 它仍然亮着，照样从圆角外侧漏。
       所以先把它改成四角圆角（与封面弧线重合，完全看不出），再按原计划延迟隐藏。 */
    .gc:not(.open) .case-base {
      opacity: 0;
      transition: opacity 0s linear .85s;
    }
    .page-inner { height: 100%; overflow-y: auto; }
    .inside-banner { height: 132px; overflow: hidden; position: relative; }
    .inside-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .inside-banner::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, #17112e 0%, transparent 70%);   /* 收尾色 = 该高度上的页面底色，横幅与页面无缝 */
    }
    .page-body { padding: 14px 18px 18px; }
    .gc-desc { font-size: .84rem; line-height: 1.75; color: rgba(233,232,247,.82); }
    .gc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .gc-stat {
      text-align: center; padding: 9px 6px; border-radius: 11px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
    }
    .gc-stat .k { font-size: .66rem; color: rgba(233,232,247,.55); }
    .gc-stat .v { font-size: .78rem; font-weight: 700; margin-top: 4px; color: #fff; }
    .gc-photos-title {
      font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(233,232,247,.5); margin: 16px 0 8px;
    }
    .thumbs { display: flex; flex-wrap: wrap; gap: 9px; }
    .thumb {
      width: 118px; height: 74px; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.14); background: #14102a;
      cursor: pointer; padding: 0;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .thumb:hover, .thumb:focus-visible {
      transform: translateY(-3px); border-color: var(--accent);
      box-shadow: 0 8px 20px -6px var(--accent); outline: none;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gc-close {
      /* sticky：内容再长，合盒按钮也一直贴在内页底部 */
      position: sticky; bottom: 0;
      margin-top: 16px; width: 100%;
      padding: 11px 16px; border-radius: 12px;
      font-size: .82rem; font-weight: 700; letter-spacing: .06em;
      color: #fff; background: #14102a;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 -10px 20px -10px #14102a;
      cursor: pointer; transition: background .25s, border-color .25s, color .25s;
    }
    .gc-close:hover { background: var(--accent); border-color: var(--accent); color: #08060f; }

    /* ---------- 封面（铰链在左缘，开盒翻到左边） ---------- */
    .case-cover {
      position: absolute;
      top: var(--edge); right: calc(var(--edge) + var(--spine));
      width: var(--pageW);
      height: calc(100% - var(--edge) * 2);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform .85s cubic-bezier(.3,.7,.25,1);
      z-index: 2;
    }
    .gc.open .case-cover { transform: rotateY(-180deg); }
    .case-front, .case-back {
      position: absolute; inset: 0;
      border-radius: var(--r); overflow: hidden;
      /* clip-path 兜一层：border-radius 的裁切在 3D 旋转下会漏 1px，
         再叠一层同半径的 clip-path，圆弧才干净。 */
      clip-path: inset(0 round var(--r));
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }

    /* 盒面 */
    .case-front {
      background: #0d0a1c;
    }
    .gc-cover {
      width: 100%; height: 100%; object-fit: cover; display: block;
      /* 🔴 图片自己也要带圆角：3D 场景里 <img> 会单独合成一层，
         父级的圆角裁切偶尔漏掉它，四角会冒出方形的一小块封面。
         两处半径同值对齐，弧线完全重合，不会露缝。 */
      border-radius: inherit;
    }
    .gc-shade {
      position: absolute; inset: 0;
      /* 第一层 = 盒脊（左侧 11px 竖带），第二层 = 整体压暗。
         盒脊不做独立元素（独立小图层在圆角处会漏裁、角上留方角），
         并进同一张底图，跟着盒子一起裁。 */
      background:
        linear-gradient(90deg, rgba(0,0,0,.75), rgba(255,255,255,.12) 55%, rgba(0,0,0,.35)) left top / 11px 100% no-repeat,
        linear-gradient(to top, rgba(5,4,12,.96) 0%, rgba(5,4,12,.42) 46%, rgba(5,4,12,.08) 100%);
    }
    .gc-no {
      position: absolute; left: 20px; top: 10px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 2.6rem; font-weight: 800; line-height: 1;
      color: rgba(255,255,255,.22); text-shadow: 0 2px 14px rgba(0,0,0,.6);
    }
    .gc-title { position: absolute; left: 24px; right: 16px; bottom: 16px; }
    .gc-title h3 { font-size: 1.12rem; font-weight: 800; }
    .gc-title p { font-size: .76rem; color: rgba(233,232,247,.72); margin-top: 3px; }
    .gc-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 9px; font-size: 1rem;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16);
      margin-bottom: 8px;
    }
    .gc-hint {
      position: absolute; right: 12px; top: 12px;
      font-size: .66rem; letter-spacing: .06em;
      padding: 4px 9px; border-radius: 999px;
      color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.18);
    }

    /* 封面背面 = 左页（光盘）
       与右页一样是「镶在盒壳里的托盘」，四角都圆 */
    .case-back {
      transform: rotateY(180deg);
      border-radius: var(--r);
      clip-path: inset(0 round var(--r));
      background: var(--case-bg);
      border: 1px solid rgba(255,255,255,.12);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 22px; text-align: center;
      cursor: pointer;
    }
    /* ---------- 盒脊：开盒后两页之间的连接处（只在开盒时出现） ----------
       关盒时两页完全重叠，这条脊如果跟着画会在封面正中间多一道竖条，
       所以只在 .gc.open 时淡入；开盒瞬间盒子正在变宽，延迟 0.28s 等它展开再出现。 */
    .case-hinge {
      position: absolute;
      /* 中缝夹在左右两页之间、且左右盒沿等宽 → 中缝中心永远落在 50% */
      left: 50%;
      /* 脊比中缝窄 14px（左右各留 7px 空隙），两页不再顶着脊，脊也不会压到页面内容 */
      width: 20px; margin-left: -10px;
      top: calc(var(--edge) + 6px);
      height: calc(100% - (var(--edge) + 6px) * 2);
      z-index: 3; transform: translateZ(3px);   /* 压在两页之上，但仍在盒子平面里 */
      pointer-events: none;
      opacity: 0;
      border-radius: 4px;
      background:
        /* ① 上下两端收暗：像塑料件收边，不至于是一条通到底的色带 */
        linear-gradient(180deg,
          rgba(0,0,0,.55) 0%, rgba(0,0,0,.14) 9%, transparent 24%,
          transparent 76%, rgba(0,0,0,.14) 91%, rgba(0,0,0,.55) 100%),
        /* ② 脊面横截面：两条外侧棱线是光的，中间一道折痕压暗。
             脊要比两页亮一档，才像凸起来的塑料件而不是一条黑洞 */
        linear-gradient(90deg,
          rgba(255,255,255,.20) 0 1px,
          rgba(255,255,255,.05) 1px 3px,
          rgba(0,0,0,.22) 48%,
          rgba(255,255,255,.05) calc(100% - 3px) calc(100% - 1px),
          rgba(255,255,255,.20) calc(100% - 1px) 100%),
        /* ③ 脊的底色：比两页亮少许，太亮会变成一根显眼的柱子 */
        linear-gradient(180deg, #322a58 0%, #262046 48%, #171130 100%);
      box-shadow:
        0 10px 22px -8px rgba(0,0,0,.75),      /* 外投影：脊是浮在两页之间的 */
        inset 0 0 16px rgba(0,0,0,.32);
      transition: opacity .45s ease;
    }
    /* 折页阴影不再用 ::before/::after 伸到两页上（那会压暗页面内容），
       改由 .case-floor 的横向渐变承担：中缝的凹陷只画在盒壳上。 */
    .gc.open .case-hinge { opacity: 1; transition-delay: .28s; }

    .disc {
      position: relative;
      /* 放大到 74%（上限 276px）：开盒时左右各留约 70px，不会碰到盒边 */
      width: min(74%, 276px);
      /* 正圆只由宽度决定：flex 里要禁止被拉伸/压缩，否则高度可能被内容带走 */
      aspect-ratio: 1; flex: 0 0 auto;
      border-radius: 50%; overflow: hidden;
      box-shadow: 0 0 0 5px rgba(255,255,255,.05), 0 14px 34px rgba(0,0,0,.65);
      animation: disc-spin 16s linear infinite;
    }
    /* 🔴 图片必须绝对定位：普通流里的 <img> 会用「图片原始比例」参与高度计算。
       换成竖版封面图后，276 宽 × (1066/780) = 377 高，圆形直接被撑成竖椭圆。
       绝对定位后它不参与布局，容器永远是 width × width 的正圆。 */
    .disc img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
    }
    /* 彩虹反光 */
    .disc::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(255,60,60,.28), rgba(255,230,60,.28), rgba(80,255,120,.28),
        rgba(60,220,255,.28), rgba(90,90,255,.28), rgba(255,60,220,.28), rgba(255,60,60,.28));
      mix-blend-mode: screen; opacity: .55;
    }
    /* 中心孔 */
    .disc::after {
      content: ""; position: absolute; inset: 39%; border-radius: 50%;
      background: #0b0817;
      box-shadow: 0 0 0 4px rgba(255,255,255,.12), inset 0 0 14px rgba(0,0,0,.9);
    }
    @keyframes disc-spin { to { transform: rotate(360deg); } }
    .disc-title { font-weight: 800; font-size: .95rem; color: #fff; }
    .disc-sub { font-size: .72rem; color: rgba(233,232,247,.6); line-height: 1.6; }
    .disc-hint {
      margin-top: 4px; font-size: .66rem; letter-spacing: .1em;
      color: var(--accent); opacity: .85;
    }

    /* ---------- 控制条 ---------- */
    .ctl-btn {
      width: 44px; height: 44px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.35rem; line-height: 1;
      color: #e9e8f7; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      cursor: pointer; transition: all .25s ease;
    }
    .ctl-btn:hover { background: rgba(34,211,238,.18); border-color: #22d3ee; color: #fff; }
    .dot {
      width: 9px; height: 9px; border-radius: 999px; padding: 0;
      background: rgba(255,255,255,.22); border: none; cursor: pointer;
      transition: all .3s ease;
    }
    .dot.on { width: 26px; background: #22d3ee; box-shadow: 0 0 12px #22d3ee; }

    /* ---------- 灯箱 ---------- */
    .lb {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(3,2,9,.94);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .lb[hidden] { display: none; }
    .lb-img {
      max-width: 92vw; max-height: 78vh; border-radius: 12px;
      box-shadow: 0 0 70px rgba(34,211,238,.22);
    }
    .lb-btn {
      position: absolute; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.2);
      color: #fff; transition: all .25s ease;
    }
    .lb-btn:hover { background: rgba(34,211,238,.25); border-color: #22d3ee; }

    /* ---------- 移动端 ---------- */
    @media (max-width: 768px) {
      .stage { height: 420px; perspective: 1200px; }
      .stage.open { height: 640px; }
      .gc { --pageW: 224px; --cardH: 306px; }
      .gc.open { --pageW: 40vw; --cardH: min(560px, 80vh); --edge: 6px; --spine: 20px; }
      .gc-stats { grid-template-columns: 1fr; }
      .thumb { width: 96px; height: 62px; }
      .inside-banner { height: 104px; }
      .page-body { padding: 12px 13px 14px; }
      .disc { width: 78%; }
      /* 手机页更窄，脊收窄一点，否则中缝会把两页挤得没有内容空间 */
      .case-hinge { width: 12px; margin-left: -6px; }
    }

    /* ---------- 减少动画偏好 ---------- */
    @media (prefers-reduced-motion: reduce) {
      .gc, .case-cover, .stage { transition-duration: .01ms !important; }
      .arcade-horizon, .scanlines::after, .disc, .arcade-drift svg { animation: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

<body>
  <!-- ===== 背景层 ===== -->
  <div class="arcade-bg" aria-hidden="true">
    <div class="arcade-grid"></div>

    <!-- 斜向慢速漂移的游戏元素：纯装饰，aria-hidden 已在父层，不参与交互。
         想换图标改 SVG 路径；想调密度就增删 <svg>；想调速度改 --d（秒）。 -->
    <div class="arcade-drift">
      <!-- 手柄（青） -->
      <svg style="--l:-12%; --d:78s; --delay:-10s; --s:96px; --r:-14deg; --o:.13; --c:#22d3ee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.6l-.6 6A4 4 0 0 0 6 19c.7 0 1.37-.24 1.9-.68L9.5 17h5l1.6 1.32c.53.44 1.2.68 1.9.68a4 4 0 0 0 3.9-4.4l-.6-6A4 4 0 0 0 17.32 5Z"/><path d="M6 11h4m-2-2v4m7-1h.01M18 12h.01"/></svg>
      <!-- 摇杆（紫） -->
      <svg style="--l:22%; --d:92s; --delay:-55s; --s:70px; --r:10deg; --o:.12; --c:#a855f7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="3"/><path d="M12 8.5V15M7 15h10l2.5 5.5h-15L7 15Z"/></svg>
      <!-- 十字键（黄） -->
      <svg style="--l:52%; --d:66s; --delay:-24s; --s:62px; --r:-8deg; --o:.13; --c:#f5d80a" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3Z"/></svg>
      <!-- 像素幽灵（青） -->
      <svg style="--l:76%; --d:100s; --delay:-72s; --s:84px; --r:12deg; --o:.13; --c:#22d3ee" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M4 21V10a8 8 0 0 1 16 0v11l-3-2-2.5 2-2.5-2-2.5 2L7 19l-3 2Zm4-12h2v3H8V9Zm6 0h2v3h-2V9Z"/></svg>
      <!-- ABXY 按钮组（粉） -->
      <svg style="--l:4%; --d:86s; --delay:-40s; --s:72px; --r:18deg; --o:.11; --c:#ff2d55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="5" r="2.6"/><circle cx="19" cy="12" r="2.6"/><circle cx="12" cy="19" r="2.6"/><circle cx="5" cy="12" r="2.6"/></svg>
      <!-- 像素爱心（紫） -->
      <svg style="--l:38%; --d:74s; --delay:-18s; --s:56px; --r:-16deg; --o:.14; --c:#a855f7" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h3v2h4V3h3v2h2v2h2v5h-2v2h-2v2h-2v2h-2v2h-2v-2H9v-2H7v-2H5v-2H3V7h2V5h2V3Z"/></svg>
      <!-- 游戏卡带（黄） -->
      <svg style="--l:64%; --d:96s; --delay:-88s; --s:76px; --r:8deg; --o:.12; --c:#f5d80a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M9 21v-4h6v4"/></svg>
      <!-- 小手柄（粉） -->
      <svg style="--l:88%; --d:68s; --delay:-46s; --s:60px; --r:-20deg; --o:.13; --c:#ff2d55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.6l-.6 6A4 4 0 0 0 6 19c.7 0 1.37-.24 1.9-.68L9.5 17h5l1.6 1.32c.53.44 1.2.68 1.9.68a4 4 0 0 0 3.9-4.4l-.6-6A4 4 0 0 0 17.32 5Z"/><path d="M6 11h4m-2-2v4m7-1h.01M18 12h.01"/></svg>
    </div>

    <div class="arcade-horizon"></div>
  </div>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ===== 顶栏 ===== -->
  <header id="topbar">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html#games"
         class="group inline-flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-cyan-300 transition-colors">
        <span class="inline-block transition-transform group-hover:-translate-x-1">←</span>
        返回主页
      </a>
      <div class="flex items-center gap-3">
        <span class="mono text-xs tracking-[.2em] text-slate-500 hidden sm:inline">GAME VAULT</span>
        <span class="font-bold tracking-tight">ITX<span class="text-cyan-400">.dev</span></span>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== 首屏 ===== -->
    <section class="relative pt-16 pb-6 text-center px-6">
      <p class="mono text-[11px] tracking-[.32em] text-cyan-400/80 mb-4">PLAYER PROFILE</p>
      <h1 class="neon mono text-4xl md:text-6xl font-extrabold tracking-[.16em] mb-5">GAME VAULT</h1>
      <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto leading-relaxed">
        我的游戏库 —— 转动转盘挑一盒，点开光盘盒看介绍与截图，再点一下合上。
      </p>
      <div class="mt-8 flex flex-wrap justify-center gap-3 text-xs">
        <span class="px-4 py-2 rounded-full bg-white/5 border border-white/10">🎮 <b class="text-white">4</b> 款游戏</span>
        <span class="px-4 py-2 rounded-full bg-white/5 border border-white/10">🖼️ <b class="text-white">8</b> 张截图</span>
        <span class="px-4 py-2 rounded-full bg-white/5 border border-white/10">💿 <b class="text-white">4</b> 张光盘</span>

    <!-- ===== 转盘 ===== -->
    <section class="py-8 px-4">
      <div id="stage" class="stage">

      <div class="mt-8 flex items-center justify-center gap-5">

      <p class="text-center text-xs text-slate-500 mt-5">
        拖拽转盘旋转 · 键盘 ← → 切换 · 点击正面盒子开盒 · Esc 合盒
      </p>

    <p class="text-center text-xs text-slate-600 pb-20">
      截图均为游戏内实拍，版权归各游戏厂商所有
    </p>

  <!-- ===== 图片灯箱 ===== -->
  <div id="lightbox" class="lb" hidden role="dialog" aria-modal="true" aria-label="游戏截图浏览">
    <button id="lbClose" class="lb-btn" style="top:20px; right:20px; width:42px; height:42px; font-size:1.2rem;"
            aria-label="关闭">×</button>
    <button id="lbPrev" class="lb-btn" style="left:20px; top:50%; transform:translateY(-50%); width:46px; height:46px; font-size:1.4rem;"
            aria-label="上一张">‹</button>
    <img id="lbImg" class="lb-img" src="" alt="游戏截图" />
    <button id="lbNext" class="lb-btn" style="right:20px; top:50%; transform:translateY(-50%); width:46px; height:46px; font-size:1.4rem;"
            aria-label="下一张">›</button>
    <div class="absolute bottom-8 left-0 right-0 flex flex-col items-center gap-3">
      <p id="lbCap" class="text-sm text-slate-300"></p>
      <div id="lbDots" class="flex items-center gap-2"></div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 游戏数据（★ 你只需要改这一段，模板和逻辑都不用动）
       ----------------------------------------------------------
       title  : 游戏名
       tagline: 一句话简介（盒面 / 光盘页显示）
       tag    : 角标（版本 / 主玩角色等）
       desc   : 开盒后右页的文字介绍
       accent : 该游戏的霓虹主色（描边、发光、按钮都用它）
       icon   : 盒面 emoji 徽章
       ★ 图片字段（都可独立换图，路径必须用正斜杠 /）★
         cover : 盒面图 —— 转盘上看到的封面
         disc  : 光盘面图 —— 开盒后左页那张圆形光盘
         inside: 内页横幅图 —— 开盒后右页顶部的横图
         photos: 截图数组 —— 右页缩略图，点开进灯箱左右翻
       ========================================================== */
    const GAMES = [
      {
        title: 'Resident Evil',
        tagline: '一款经典的生存恐怖游戏系列',
        tag: '2-4re / 5.6 / 7.8.9',
        desc: '卡普空的生存恐怖招牌系列。从 1996 年洋馆事件开始，围绕生化病毒、保护伞公司与多代主角展开。系列在“恐怖”与“动作”之间反复摇摆，每一代都是一次方向实验——正因如此，每一代都有忠实拥趸。',
        accent: '#ff2d55',
        icon: '🧟',
        cover: 'images/RE-封面.jpg',
        disc: 'images/RE-封面2.jpg',
        inside: 'images/RE-2.jpg',
        stats: [
          { k: '入坑年份', v: '2023' },
          { k: '最推荐', v: 'RE4 重制' },
          { k: '最喜欢的角色', v: '里昂·斯科特·肯尼迪' },
        ],
        photos: [
          { src: 'images/RE-1.jpg', caption: '《生化危机》游戏截图 1' },
          { src: 'images/RE-2.jpg', caption: '《生化危机》游戏截图 2' },
        ],
      },
      {
        title: 'Street Fighter 6',
        tagline: 'Capcom 的经典格斗游戏系列',
        tag: '主玩角色：Cammy',
        desc: '格斗游戏正统续作。新加入的“现代操作模式”让新手能快速打出一套连招，而 Drive 系统又给高手留足了深度。主玩 Cammy——她的快速接近压制打法最对我的节奏。',
        accent: '#f5d90a',
        icon: '🥊',
        cover: 'images/SF6-1.jpg',
        disc: 'images/SF6-1.jpg',
        inside: 'images/SF6-2.jpg',
        stats: [
          { k: '主玩角色', v: 'Cammy' },
          { k: '常用模式', v: '经典模式' },
          { k: '练习方式', v: '训练场' },
        ],
        photos: [
          { src: 'images/SF6-1.jpg', caption: '《SF6》游戏截图 1' },
          { src: 'images/SF6-2.jpg', caption: '《SF6》游戏截图 2' },
        ],
      },
      {
        title: 'Metro',
        tagline: '一款俄式末日废土风格的游戏',
        tag: '正传三部曲 · 主角：阿尔乔姆',
        desc: '改编自同名小说的末日废土 FPS。核战后的莫斯科，人类残存在地铁隧道里，地表是辐射与变异生物。跟着阿尔乔姆从 2033 一路走到离去——最难忘的始终是第一次踏出隧道、戴上防毒面具看地表的那一刻。',
        accent: '#22d3ee',
        icon: '🚇',
        cover: 'images/MTD-1.jpg',
        disc: 'images/MTD-1.jpg',
        inside: 'images/MTD-2.jpg',
        stats: [
          { k: '三部曲', v: '2033 / 最后曙光 / 离去' },
          { k: '主角', v: '阿尔乔姆' },
          { k: '最难忘', v: '首次上地表' },
        ],
        photos: [
          { src: 'images/MTD-1.jpg', caption: '《Metro》游戏截图 1' },
          { src: 'images/MTD-2.jpg', caption: '《Metro》游戏截图 2' },
        ],
      },
      {
        title: 'Minecraft',
        tagline: '在三维空间里自由创造与破坏的沙盒游戏',
        tag: '真正的自由世界',
        desc: '十年老兵。从生存模式的第一个夜晚，到后来的红石机械与大型建筑，它给我的从来不只是游戏——而是一个“想造什么就造什么”的世界。第一次挖到钻石的那个坐标，我到现在还记得。',
        accent: '#4ade80',
        icon: '⛏️',
        cover: 'images/MC-1.jpg',
        disc: 'images/MC-1.jpg',
        inside: 'images/MC-2.jpg',
        stats: [
          { k: '游玩年限', v: '10 年' },
          { k: '最爱模式', v: '生存 + 红石' },
          { k: '代表记忆', v: '首次挖到钻石' },
        ],
        photos: [
          { src: 'images/MC-1.jpg', caption: '《Minecraft》游戏截图 1' },
          { src: 'images/MC-2.jpg', caption: '《Minecraft》游戏截图 2' },
        ],
      },
    ];

    /* ---------- 2. 生成光盘盒 ---------- */
    const ring  = document.getElementById('ring');
    const stage = document.getElementById('stage');
    const dotsBox = document.getElementById('dots');

    const N = GAMES.length;
    const STEP = 360 / N;
    let radius = 340;
    let angle = 0;
    let openIndex = -1;                 // -1 = 没有盒子打开

    function cardHTML(g, i) {
      const stats = g.stats.map(s => `
            <div class="gc-stat"><p class="k">${s.k}</p><p class="v">${s.v}</p></div>`).join('');
      const thumbs = g.photos.map((p, pi) => `
            <button class="thumb" data-photo="${pi}" aria-label="查看 ${g.title} 截图 ${pi + 1}">
              <img src="${p.src}" alt="${p.caption}" loading="lazy">
            </button>`).join('');

      return `
        <article class="gc" data-i="${i}" tabindex="0" role="button"
                 aria-label="${g.title}，点击打开光盘盒"
                 style="--accent:${g.accent}">

          <!-- 盒壳：开盒后露出的盒子本体（内衬沿 + 中缝），两页是嵌在它里面的托盘 -->
          <span class="case-floor" aria-hidden="true"></span>

          <!-- 盒底 = 右页：内页横幅 + 文字介绍 + 截图 -->
          <div class="case-base">
            <div class="page-inner">
              <div class="inside-banner"><img src="${g.inside}" alt="${g.title} 内页图" loading="lazy"></div>
              <div class="page-body">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <h3 class="text-base font-extrabold text-white">${g.title}</h3>
                  <span class="text-[10px] px-2 py-1 rounded-full"
                        style="color:${g.accent};border:1px solid ${g.accent}55;background:${g.accent}14">${g.tag}</span>
                </div>
                <p class="gc-desc mt-2">${g.desc}</p>
                <div class="gc-stats">${stats}</div>
                <p class="gc-photos-title mono">Screenshots · ${g.photos.length} 张</p>
                <div class="thumbs">${thumbs}</div>
                <button class="gc-close" data-close="1">▲ 合上盒子</button>
              </div>
            </div>
          </div>

          <!-- 封面：关盒时是盒面，开盒后翻到左边变成光盘页 -->
          <div class="case-cover">
            <div class="case-front">
              <img class="gc-cover" src="${g.cover}" alt="${g.title} 盒面" loading="lazy">
              <div class="gc-shade"></div>
              <span class="gc-no mono">0${i + 1}</span>
              <span class="gc-hint">点击开盒</span>
              <div class="gc-title">
                <span class="gc-badge">${g.icon}</span>
                <h3 class="text-white">${g.title}</h3>
                <p>${g.tagline}</p>
              </div>
            </div>
            <div class="case-back" title="点击合上盒子">
              <div class="disc"><img src="${g.disc}" alt="${g.title} 光盘" loading="lazy"></div>
              <p class="disc-title">${g.title}</p>
              <p class="disc-sub">${g.tagline}</p>
              <p class="disc-hint mono">CLICK TO CLOSE · 点击合盒</p>
            </div>
          </div>

          <!-- 盒脊：两页之间的连接处，开盒时才出现，让盒子看起来是「折开的」而不是两块板拼在一起 -->
          <span class="case-hinge" aria-hidden="true"></span>
        </article>`;
    }

    ring.innerHTML = GAMES.map(cardHTML).join('');
    const cards = Array.from(ring.querySelectorAll('.gc'));

    dotsBox.innerHTML = GAMES.map((g, i) =>
      `<button class="dot" data-go="${i}" aria-label="转到 ${g.title}"></button>`).join('');
    const dots = Array.from(dotsBox.querySelectorAll('.dot'));

    /* ---------- 3. 布局：把盒子摆到 3D 圆环上 ---------- */
    function currentIndex() {
      const raw = Math.round(-angle / STEP) % N;
      return ((raw % N) + N) % N;
    }

    function layout() {
      radius = window.innerWidth < 768 ? 210 : 340;

      cards.forEach((el, i) => {
        // 打开的盒子：脱离圆环，居中放大（开盒动画由 .case-cover 自己完成）
        if (i === openIndex) {
          el.classList.remove('is-back');
          el.style.transform = 'translate(-50%,-50%) translate3d(0,0,80px) rotateY(0deg) scale(1)';
          el.style.opacity = '1';
          el.style.zIndex = '999';
          return;
        }

        const deg = ((i * STEP + angle) % 360 + 540) % 360 - 180;
        const rad = deg * Math.PI / 180;
        const facing = Math.cos(rad);                 // 1 = 正对镜头
        const x = Math.sin(rad) * radius;
        const z = (Math.cos(rad) - 1) * radius;

        // 倾斜限幅 ±62°：转过头会露出镜像背面
        let tilt = deg * 0.5;
        tilt = Math.max(-62, Math.min(62, tilt));
        const scale = 0.86 + 0.14 * Math.max(0, facing);

        let op = 0.45 + 0.55 * Math.max(0, facing);
        if (openIndex !== -1) op = 0.18;              // 有盒子打开时其余退到背景

        el.style.transform =
          `translate(-50%,-50%) translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${tilt.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
        el.style.opacity = op.toFixed(3);
        el.style.zIndex = String(Math.round(facing * 100) + 100);

        const isBack = facing < -0.05 || openIndex !== -1;
        el.classList.toggle('is-back', isBack);
      });

      const ci = currentIndex();
      dots.forEach((d, i) => d.classList.toggle('on', i === ci));
    }

    /* ---------- 4. 旋转：转到第 i 盒（走近路，不绕整圈） ---------- */
    function goTo(i) {
      const target = -i * STEP;
      const k = Math.round((angle - target) / 360);
      angle = target + k * 360;
      layout();
    }
    const step = d => goTo(currentIndex() + d);
    document.getElementById('prev').onclick = () => step(-1);
    document.getElementById('next').onclick = () => step(1);
    dotsBox.onclick = e => {
      const b = e.target.closest('[data-go]');
      if (b) goTo(Number(b.dataset.go));
    };

    /* ---------- 5. 开盒 / 合盒 ---------- */
    function openCard(i) {
      if (openIndex === i) return;
      openIndex = i;
      stage.classList.add('open');
      cards.forEach(el => el.classList.remove('open'));
      cards[i].classList.add('open');
      layout();
      cards[i].querySelector('.page-inner').scrollTop = 0;
      // 开盒后盒子变宽一倍，把它带到视野中央
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function closeCard() {
      if (openIndex === -1) return;
      cards[openIndex].classList.remove('open');
      openIndex = -1;
      stage.classList.remove('open');
      layout();
    }

    ring.addEventListener('click', e => {
      if (suppressClick) return;          // 刚拖完转盘，忽略这次 click
      const thumb = e.target.closest('[data-photo]');
      if (thumb) { openLightbox(Number(thumb.dataset.photo)); return; }
      if (e.target.closest('[data-close]')) { closeCard(); return; }

      const card = e.target.closest('.gc');
      if (!card) return;
      const i = Number(card.dataset.i);

      // 开盒状态下：点光盘页（左页）合盒；点右页文字区不处理，避免误触
      if (openIndex !== -1) {
        if (i === openIndex && e.target.closest('.case-back')) closeCard();
        return;
      }
      if (currentIndex() !== i) { goTo(i); return; }   // 不在正面先转过来
      openCard(i);
    });

    ring.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.gc');
      if (!card) return;
      e.preventDefault();
      const i = Number(card.dataset.i);
      if (openIndex === i) closeCard();
      else if (currentIndex() === i && openIndex === -1) openCard(i);
      else goTo(i);
    });

    /* ---------- 6. 拖拽转转盘 ----------
       ⚠️ 关键：不要在 pointerdown 就 setPointerCapture！
       一旦捕获，浏览器会把随后的 click 派发给 stage 而不是卡片，
       结果点击封面永远开不了盒。所以只有真的拖动超过阈值才捕获。 */
    let pointerDown = false, dragging = false;
    let startX = 0, startAngle = 0, moved = 0;
    let suppressClick = false;            // 拖拽后的那次 click 不应触发开盒

    stage.addEventListener('pointerdown', e => {
      if (openIndex !== -1) return;
      pointerDown = true; dragging = false; moved = 0;
      startX = e.clientX; startAngle = angle;
    });

    stage.addEventListener('pointermove', e => {
      if (!pointerDown) return;
      moved = e.clientX - startX;
      if (!dragging) {
        if (Math.abs(moved) < 6) return;  // 位移很小 = 用户只是想点击，不进入拖拽
        dragging = true;
        cards.forEach(el => el.style.transition = 'none');
        try { stage.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件没有活动指针，忽略 */ }
      }
      angle = startAngle + moved * 0.32;
      layout();
    });

    const endDrag = () => {
      if (!pointerDown) return;
      pointerDown = false;
      if (!dragging) return;              // 没拖过 = 普通点击，直接放行
      dragging = false;
      cards.forEach(el => el.style.transition = '');
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      goTo(currentIndex());               // 松手吸附到最近一盒
    };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    /* ---------- 7. 键盘全局：← → 切换，Esc 合盒 ---------- */
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').hidden) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lbStep(-1);
        else if (e.key === 'ArrowRight') lbStep(1);
        return;
      }
      if (e.key === 'Escape') closeCard();
      else if (e.key === 'ArrowLeft') { closeCard(); step(-1); }
      else if (e.key === 'ArrowRight') { closeCard(); step(1); }
    });

    /* ---------- 8. 截图灯箱 ---------- */
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCap = document.getElementById('lbCap');
    const lbDots = document.getElementById('lbDots');
    let lbList = [], lbAt = 0;

    function openLightbox(i) {
      const g = GAMES[openIndex];
      lbList = g.photos; lbAt = i;
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      paintLightbox();
    }
    function closeLightbox() {
      lb.hidden = true;
      document.body.style.overflow = '';
      if (openIndex !== -1) cards[openIndex].focus({ preventScroll: true });
    }
    function lbStep(d) { lbAt = (lbAt + d + lbList.length) % lbList.length; paintLightbox(); }
    function paintLightbox() {
      const p = lbList[lbAt];
      lbImg.src = p.src; lbImg.alt = p.caption; lbCap.textContent = p.caption;
      lbDots.innerHTML = lbList.map((_, i) =>
        `<span style="width:8px;height:8px;border-radius:999px;display:inline-block;
          background:${i === lbAt ? '#22d3ee' : 'rgba(255,255,255,.25)'}"></span>`).join('');
    }
    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lbPrev').onclick = () => lbStep(-1);
    document.getElementById('lbNext').onclick = () => lbStep(1);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

    /* ---------- 9. 启动 ---------- */
    layout();
    window.addEventListener('resize', layout);
  </script>
</body>
</html>
